<!DOCTYPE html>
<html lang="{{ site.Language.LanguageCode | default "zh-CN" }}">
<head>
  {{ partial "head.html" . }}
</head>
<body>
  <a class="skip-link" href="#main">跳到正文</a>
  {{ partial "header.html" . }}
  <main id="main" class="col{{ if and .IsPage (eq .Section "posts") }} col-wide{{ end }}">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
  {{ partial "scripts.html" . }}
</body>
</html>
