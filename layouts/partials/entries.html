{{ $pages := . }}
<ol class="entries">
  {{- range $pages }}
  <li class="entry">
    <div class="entry-meta"><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006-01-02" }}</time></div>
    <h2 class="entry-title"><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
    {{- with .Description }}
    <p class="entry-summary">{{ . }}</p>
    {{- end }}
  </li>
  {{- end }}
</ol>
