<header class="masthead">
  <div class="col masthead-inner">
    <a class="wordmark" href="{{ "/" | relURL }}">
      <span class="mark" aria-hidden="true">{{ substr site.Title 0 1 | upper }}</span>
      <span>{{ site.Title }}</span>
    </a>
    <nav class="nav" aria-label="主导航">
      {{- range site.Menus.main }}
      <a href="{{ .URL | relURL }}"{{ if $.IsMenuCurrent "main" . }} aria-current="page"{{ end }}>{{ .Name }}</a>
      {{- end }}
      <button class="theme-toggle" type="button" aria-label="切换深浅色" title="切换深浅色">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4" />
          <circle cx="12" cy="12" r="4" />
        </svg>
      </button>
    </nav>
  </div>
</header>
